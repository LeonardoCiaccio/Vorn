name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant Lite
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: '.github/cla-signatures/v1.0.json'
          path-to-document: 'https://github.com/LeonardoCiaccio/Vorn/blob/master/CLA.md'
          branch: 'cla-signatures'
          allowlist: 'LeonardoCiaccio,dependabot[bot],bot*'
          custom-notsigned-prcomment: >
            Thank you for your contribution! Before this pull request can be
            merged, you need to sign our
            [Contributor License Agreement](https://github.com/LeonardoCiaccio/Vorn/blob/master/CLA.md).
            You can sign by posting the comment below. You only need to do this
            once — it covers all your future contributions.
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA ✔️'
          lock-pullrequest-aftermerge: false
